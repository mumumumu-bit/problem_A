[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npu-scheduler"
version = "0.1.0"
description = "Evaluator-guided DAG partitioning and multicore scheduling"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8", "PyYAML>=6"]

[project.scripts]
npu-schedule = "npu_scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

